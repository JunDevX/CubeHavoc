name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          PAYLOAD=$(jq -n \
            --arg name "$RELEASE_NAME" \
            --arg actor "$ACTOR" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: ("НОВЫЙ РЕЛИЗ! " + $name),
                color: 3447003,
                fields: [
                  {
                    name: "Выпустил",
                    value: ("[" + $actor + "](https://github.com/" + $actor + ")"),
                    inline: true
                  },
                  {
                    name: "Тег релиза",
                    value: ("```" + $tag + "```"),
                    inline: true
                  },
                  {
                    name: "Установить сейчас",
                    value: ("[" + $name + "](" + $url + ")"),
                    inline: false
                  }
                ]
              }]
            }')

          curl -g -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
